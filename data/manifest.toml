# Pinned upstream sources for the packs in this directory.
# Regenerate packs with: cargo run --release -p game-data-pack -- --pinned
# Update pins + regenerate with: cargo run --release -p game-data-pack -- --latest
#
# `sparse_paths` is optional: when it is absent the generator derives the
# per-language sheet patterns from SHEETS (see game-data-pack/src/fetch.rs).
# `checkout_subdir` places a source inside the assembled ffxiv-datamining tree.
#
# `[icons]` records the FFXIV client version (game/ffxivgame.ver) the icon pack
# was extracted from — icons come from a local game install, not a git source.
#
# This header is rewritten by `Manifest::save`; comments added below it are NOT
# preserved across a --latest run.

[sources.ffxiv-datamining]
url = "https://github.com/xivapi/ffxiv-datamining.git"
sha = "a67c23b00fe8cb254855d06b59845958b55d28f3"

[sources.ffxiv-datamining-cn]
url = "https://github.com/thewakingsands/ffxiv-datamining-cn.git"
sha = "3ba064a64e21ff62b587d886701bbe6e74d8d224"
checkout_subdir = "csv/cn"

[sources.ffxiv-datamining-ko]
url = "https://github.com/Ra-Workspace/ffxiv-datamining-ko.git"
sha = "5816cb2d9cb7560202bc205dce9b623872804145"
branch = "refactor"
checkout_subdir = "csv/ko"

[sources.ffxiv-datamining-tc]
url = "https://github.com/thewakingsands/ffxiv-datamining-tc.git"
sha = "e203c7e46dd80fd2a967e5741b30e3c9fad0c767"
checkout_subdir = "csv/tc"

[icons]
game_version = "2026.09.01.0000.0000"
