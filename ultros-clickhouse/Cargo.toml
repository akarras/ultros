[package]
name = "ultros-clickhouse"
version = "0.1.0"
edition = "2024"

[dependencies]
clickhouse = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7.18"
tracing = { workspace = true }
metrics = "0.24.5"
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_repr = "0.1"
chrono = { workspace = true }
futures = { workspace = true }
ultros-db = { path = "../ultros-db" }
ultros-api-types = { path = "../ultros-api-types" }
xiv-gen-db = { path = "../xiv-gen-db", features = ["embed"] }
xiv-gen = { workspace = true }
# The one-shot maintenance binaries in src/bin (backfill, parity check,
# inspect). They used to live in the server crate, which made building them
# wait on the whole Leptos SSR app.
dotenvy = { workspace = true }
sea-orm = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
# `start_paused` runtimes: the shutdown-drain budget test would otherwise
# spend its budget in real seconds.
tokio = { workspace = true, features = ["test-util"] }
