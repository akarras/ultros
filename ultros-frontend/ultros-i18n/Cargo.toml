[package]
name = "ultros-i18n"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
leptos.workspace = true
leptos_i18n.workspace = true

[build-dependencies]
# Keep generated translations multiline for fast Clippy source scans.
leptos_i18n_build = { workspace = true, features = ["pretty_print"] }

[features]
default = []
ssr = ["leptos/ssr", "leptos_i18n/axum"]
hydrate = ["leptos/hydrate", "leptos_i18n/hydrate"]

[dev-dependencies]
any_spawner = { version = "0.3", features = ["futures-executor"] }
