[package]
name = "ultros-app"
version = "0.1.0"
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ultros-ui-shell = { path = "../ultros-ui-shell", default-features = false }
ultros-ui-crafting = { path = "../ultros-ui-crafting", default-features = false }
ultros-ui-lists = { path = "../ultros-ui-lists", default-features = false }
ultros-ui-alerts = { path = "../ultros-ui-alerts", default-features = false }
ultros-ui-market = { path = "../ultros-ui-market", default-features = false }
ultros-ui-charts = { path = "../ultros-ui-charts", default-features = false }
ultros-ui-game = { path = "../ultros-ui-game", default-features = false }
ultros-ui-query = { path = "../ultros-ui-query", default-features = false }
ultros-ui-grid = { path = "../ultros-ui-grid", default-features = false }
ultros-frontend-core = { path = "../ultros-frontend-core", default-features = false }
ultros-crafting = { path = "../ultros-crafting" }
ultros-calc = { path = "../ultros-calc" }
ultros-ui = { path = "../ultros-ui", default-features = false }
ultros-i18n = { path = "../ultros-i18n", default-features = false }
ultros-changelog = { path = "../../ultros-changelog" }
ultros-api-client = { path = "../ultros-api-client", default-features = false }
leptos = { workspace = true, features = ["nightly"] }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
leptos_axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
leptos-use = { workspace = true }
xiv-gen-db = { path = "../../xiv-gen-db" }
xiv-gen.workspace = true
web-sys = { version = "0.3", optional = true, features = [
    "AbortController",
    "Clipboard",
    "Window",
    "Location",
    "Navigator",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "TextMetrics",
    "NodeList",
    "HtmlDivElement",
    "HtmlElement",
    "HtmlDocument",
    "HtmlHeadElement",
    "Document",
    "DomRect",
    "Element",
    # FilterChip tells "the user cleared this" from "the number input holds
    # something it cannot parse" — both report an empty value.
    "HtmlInputElement",
    # FilterChip's select variant commits from blur/Enter, which needs the
    # select's current value off the event target.
    "HtmlSelectElement",
    "ValidityState",
    "PointerEvent",
    # VirtualGrid's delegated cell click and its single active-outline effect.
    "MouseEvent",
    "DomTokenList",
    "ResizeObserver",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "Event",
    # Web Push subscribe flow — see push_subscribe::enable_browser_notifications.
    "ServiceWorkerContainer",
    "ServiceWorkerRegistration",
    "PushManager",
    "PushSubscription",
    "PushSubscriptionOptionsInit",
    "PushEncryptionKeyName",
    "Notification",
    "NotificationPermission",
] }
ultros-api-types = { path = "../../ultros-api-types" }
serde = { workspace = true, features = ["rc"] }
thousands = "0.2.0"
chrono.workspace = true
itertools.workspace = true
futures = "0.3.32"
humantime = "2.3"
log = "0.4.29"
cookie = { version = "0.18.1", features = ["percent-encode"] }
wasm-bindgen = { version = "0.2", optional = true }
time = "0.3.47"
js-sys = { version = "0.3", optional = true }
tracing = "0.1"
serde_json = { workspace = true }
ultros-charts = { path = "../ultros-charts", features = ["leptos"] }
icondata.workspace = true
gloo-timers = { version = "0.4.0", features = ["futures"] }
paginate = "1.1.11"
percent-encoding = "2.3.2"
# leptos_animation = "0.5.0"
leptos_hotkeys = { git = "https://github.com/slowtec/leptos-hotkeys.git", branch = "leptos-0.8" }
send_wrapper = "0.6"
icondata_core.workspace = true
leptos_i18n.workspace = true
ultros-list-doc = { path = "../../ultros-list-doc" }
base64 = "0.22.1"

[features]
default = [
    "ssr",
] # this is mostly so if I run cargo check, it has a flavor to work on
hydrate = [
    "ultros-ui-shell/hydrate",
    "ultros-ui-crafting/hydrate",
    "ultros-ui-lists/hydrate",
    "ultros-ui-alerts/hydrate",
    "ultros-ui-market/hydrate",
    "ultros-ui-charts/hydrate",
    "ultros-ui-game/hydrate",
    "ultros-ui-query/hydrate",
    "ultros-ui-grid/hydrate",
    "ultros-frontend-core/hydrate",
    "ultros-ui/hydrate",
    "ultros-i18n/hydrate",
    "leptos/hydrate",
    "web-sys",
    "wasm-bindgen",
    "time/wasm-bindgen",
    "js-sys",
    "leptos_i18n/hydrate",
    "ultros-api-client/hydrate",
]
ssr = [
    "ultros-ui-shell/ssr",
    "ultros-ui-crafting/ssr",
    "ultros-ui-lists/ssr",
    "ultros-ui-alerts/ssr",
    "ultros-ui-market/ssr",
    "ultros-ui-charts/ssr",
    "ultros-ui-game/ssr",
    "ultros-ui-query/ssr",
    "ultros-ui-grid/ssr",
    "ultros-frontend-core/ssr",
    "ultros-ui/ssr",
    "ultros-i18n/ssr",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "leptos_axum",
    "web-sys",
    "xiv-gen-db/embed",
    "leptos-use/ssr",
    "axum",
    "leptos_hotkeys/ssr",
    "leptos_i18n/axum",
    "ultros-api-client/ssr",
]

[dev-dependencies]
# Share layout assertions with route tests without shipping them in the app.
ultros-ui-grid = { path = "../ultros-ui-grid", default-features = false, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
# Standing up a global executor is a prerequisite for building any reactive
# effect outside of a running app, including SSR component tests.
any_spawner = { version = "0.3", features = ["futures-executor"] }
