[package]
name = "ultros-ui"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
ultros-grid-core = { path = "../ultros-grid-core" }
ultros-i18n = { path = "../ultros-i18n", default-features = false }
leptos.workspace = true
leptos_router.workspace = true
leptos-use.workspace = true
leptos_i18n.workspace = true
icondata.workspace = true
icondata_core.workspace = true
serde.workspace = true
serde_json.workspace = true
codee = { version = "0.3.5", features = ["json_serde"] }
gloo-timers = { version = "0.4.0", features = ["futures"], optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlDivElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "ValidityState",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "TextMetrics",
    "CssStyleDeclaration",
    "DomRect",
    "DomTokenList",
    "NodeList",
    "MouseEvent",
    "PointerEvent",
    "KeyboardEvent",
    "ResizeObserver",
] }

[features]
default = []
ssr = [
    "leptos/ssr",
    "leptos_router/ssr",
    "leptos-use/ssr",
    "ultros-i18n/ssr",
]
hydrate = [
    "leptos/hydrate",
    "ultros-i18n/hydrate",
    "dep:gloo-timers",
    "dep:js-sys",
    "dep:wasm-bindgen-futures",
]

[dev-dependencies]
any_spawner = { version = "0.3", features = ["futures-executor"] }
