name: rust

on:
    push:
        branches: ["main"]
        # Publish semver tags as releases.
        tags: ["v*.*.*"]
        paths-ignore:
            - "userguide/**"
            - "**/*.md"
            - ".github/workflows/book.yml"
            - ".github/workflows/book-check.yml"
    pull_request:
        branches: ["main"]
        paths-ignore:
            - "userguide/**"
            - "**/*.md"
            - ".github/workflows/book.yml"
            - ".github/workflows/book-check.yml"

env:
    CARGO_TERM_COLOR: always
    # Bound simultaneous rustc processes on standard hosted runners.
    CARGO_BUILD_JOBS: "2"

permissions:
    contents: read

jobs:
    check:
        name: Lint, checks, and tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4.2.2
              with:
                  lfs: true
            - name: Install system packages
              # normally i do an apt upgrade here, but we install snap and firefox??
              run: sudo apt update && sudo apt install -y libfreetype6 libfreetype6-dev cmake build-essential curl sudo pkg-config libssl-dev fontconfig libfontconfig1-dev
            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: nightly-2026-01-06
                  components: rustfmt, clippy
            # Restore on every run, but only *save* from main. Actions caches
            # are scoped per-ref, so a plain actions/cache here wrote a fresh
            # ~1.2GB copy of this key for every PR — six of them filled 69% of
            # the repo's 10GB quota, and GitHub's LRU then evicted the Docker
            # workflow's buildkit blobs mid-export (`failed to solve:
            # not_found`). PRs still get a warm cache: restore-keys falls back
            # to main's copy.
            - name: Restore cargo registry and build artifacts
              uses: actions/cache/restore@v4.2.0
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-

            - name: Run shared lint and Rust regression checks
              run: ./check_ci.sh

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Run JavaScript regression tests
              # These use node:test and local fixtures; no browser, app server,
              # package installation, credentials or external services needed.
              run: node --test integration/*.test.cjs

            # Only main writes the cache (see the restore step above). Runs on
            # failure too, so a red lint run still leaves the next build warm;
            # skipped when the key already exists, hence continue-on-error.
            - name: Save cargo registry and build artifacts
              if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
              continue-on-error: true
              uses: actions/cache/save@v4.2.0
              with:
                  path: |
                      ~/.cargo/bin
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    audit:
        name: Dependency security advisory report
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4.2.2

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Install cargo-binstall
              uses: cargo-bins/cargo-binstall@main

            - name: Install cargo-audit
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: cargo +stable binstall --no-confirm cargo-audit

            - name: Check locked dependencies against RustSec
              id: audit
              # Existing advisories require dependency migrations; report them
              # visibly without blocking unrelated PRs or suppressing any IDs.
              # See scripts/DEPENDENCY_AUDIT.md for the initial triage.
              continue-on-error: true
              run: cargo +stable audit --file Cargo.lock --json > audit-report.json

            - name: Install Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Summarize dependency advisories
              # Invalid/missing reports fail here, so a broken audit tool does
              # not silently produce a green security report.
              run: node scripts/summarize_audit.cjs audit-report.json

            - name: Upload dependency audit report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: dependency-audit
                  path: audit-report.json
                  if-no-files-found: error
