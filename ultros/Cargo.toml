[package]
name = "ultros"
version = "0.1.0"
edition = "2024"
license = "MIT or Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
universalis = { path = "../universalis", features = ["websocket"] }
ultros-db = { path = "../ultros-db", features = ["rkyv"] }
ultros-list-doc = { path = "../ultros-list-doc" }
ultros-clickhouse = { path = "../ultros-clickhouse" }
clickhouse = { workspace = true }
sea-orm = { workspace = true }
anyhow = { workspace = true }
axum.workspace = true
axum-extra.workspace = true
axum-macros = { workspace = true }
cookie = "0.18.1"
xiv-gen-db = { path = "../xiv-gen-db", features = ["embed"] }
poise = { version = "0.6.2" }
chrono = { workspace = true }
lodestone = { git = "https://github.com/akarras/lodestone.git", branch = "master", default-features = false, features = [
    "rustls-tls",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
] }
xiv-gen.workspace = true
serde = { workspace = true }
include_dir = "0.7.4"
mime_guess = "2.0.5"
tokio = { workspace = true }
tokio-util = { version = "0.7.18" }
tracing = { workspace = true }
tracing-subscriber = "0.3"
futures = { workspace = true }
oauth2 = "5.0"
serde_json = { workspace = true }
thiserror = { workspace = true }
dotenvy = { workspace = true }
metrics = "0.24.5"
envy = "0.4.2"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.10", features = ["full"] }
sha2 = "0.11.0"
base64 = "0.22.1"
itertools = "0.14.0"
sitemap-rs = "0.4.0"
ultros-api-types = { path = "../ultros-api-types", features = ["rkyv"] }
# The `history` feature (on by default) is what makes the full changelog
# available to `/api/v1/changelog`; the wasm client builds without it.
ultros-changelog = { path = "../ultros-changelog" }
ultros-xiv-icons = { path = "../ultros-frontend/ultros-xiv-icons" }
leptos = { workspace = true, features = ["ssr", "nightly"] }
leptos_axum.workspace = true
leptos_router = { workspace = true, features = ["ssr"] }
ultros-app = { path = "../ultros-frontend/ultros-app", features = ["ssr"] }
hyper = "1.9.0"
tokio-stream = { version = "0.1.18", features = ["sync"] }
ultros-charts = { path = "../ultros-frontend/ultros-charts", features = [
    "image",
] }
ultros-item-card = { path = "../ultros-item-card" }
ultros-game-sources = { path = "../ultros-game-sources" }
# The server's service crates, split out of this one so each builds (and
# tests) without the Leptos SSR app; this crate is the web layer that wires
# them together.
ultros-analyzer = { path = "../ultros-analyzer" }
ultros-ingest = { path = "../ultros-ingest" }
ultros-search = { path = "../ultros-search" }
ultros-server-core = { path = "../ultros-server-core" }
ultros-alerts = { path = "../ultros-alerts" }
ultros-character = { path = "../ultros-character" }
ultros-group-sync = { path = "../ultros-group-sync" }
ultros-lists = { path = "../ultros-lists" }
resvg = "0.47.0"
isocountry = "0.3.2"
http-body = "1.0.1"
http-body-util = "0.1.3"
tikv-jemallocator = { version = "0.7.0", features = [
    "profiling",
    "unprefixed_malloc_on_supported_platforms",
], optional = true }
jemalloc_pprof = { version = "0.9.0", optional = true }
url = "2.5.8"
sentry = { version = "0.49", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls",
] }
sentry-tracing = "0.49"
sentry-tower = { version = "0.49", features = ["http"] }
# Direct dep so we can install a process-level CryptoProvider at startup.
# Transitive consumers (serenity, reqwest 0.12/0.13, sqlx, tokio-rustls, sentry) pull
# in rustls 0.23 with both `aws-lc-rs` and `ring` activated via feature unification,
# which makes `ClientConfig::builder()` panic with "Could not automatically determine
# the process-level CryptoProvider". We install one explicitly in `main()`.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

# Unix-only, and only for `getrlimit`/`setrlimit` in `fd_limit`. Docker gives a
# container the daemon's default RLIMIT_NOFILE soft limit of 1024, which this
# process blows through under a crawl burst (GlitchTip #7188). `libc` is already
# in the tree transitively, so this is a free direct dep.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.6.0"
# `sentry::test::with_captured_events` is the only way to assert what actually
# lands on an event (the transaction name that GlitchTip groups by). Dev-only,
# so the test transport never ships.
sentry = { version = "0.49", default-features = false, features = ["test"] }
# `#[tokio::test(start_paused = true)]` (retry-backoff tests in
# item_update_service.rs) needs tokio's virtual clock, which only exists
# behind "test-util". Scoped to dev-dependencies so it never ships.
tokio = { workspace = true, features = ["test-util"] }
# The `ssr_drain` arena test renders a real `<Title>` through leptos_axum's
# 404 fallback; the app crate already enables leptos_meta/ssr for every SSR build.
leptos_meta = { workspace = true, features = ["ssr"] }
# leptos_axum's route handlers install the tokio executor for reactive tasks
# on their first request; the fallback used directly in that test does not.
any_spawner = { version = "0.3", features = ["tokio"] }

[features]
profiling = ["dep:tikv-jemallocator", "dep:jemalloc_pprof"]
jemalloc = ["dep:tikv-jemallocator"]
# Exposes /test/login for E2E tests. Compile-time gated so prod binaries
# physically cannot contain this route. Build with: --features test-auth
test-auth = ["ultros-ingest/test-auth", "ultros-server-core/test-auth"]
default = []
