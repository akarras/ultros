[build]
rustflags = [
    "--cfg=web_sys_unstable_apis",
    # Type-erased components in EVERY build, release included. leptos keys its
    # `__internal_erase_components` macro feature off this cfg (see
    # `[target."cfg(erase_components)".dependencies.leptos_macro]` in leptos's
    # Cargo.toml): each `#[component]` returns `AnyView` and each `{move || …}`
    # child collapses to one shared closure type, so the view tree stops
    # monomorphizing per call site. Measured on 7fe53c70 (wasm-bindgen +
    # wasm-opt -Oz, brotli -q 11): 23.78 MB -> 17.17 MB raw, 4.95 MB -> 3.48 MB
    # on the wire, and the frontend release build went from ~35 to ~9 minutes.
    #
    # It has to be set for the server AND the client: `AnyView` writes a `<!>`
    # hydration marker after its content, so a typed SSR tree and an erased
    # client tree would disagree about the DOM and panic in hydration. cargo-
    # leptos already does exactly this for every dev build (`erase_components`
    # is its debug default), so this is the mode the app has always run under
    # locally; release just stops opting out of it.
    #
    # Set here rather than via cargo-leptos's `always-erase-components` so
    # Docker's `cargo chef cook` layers see the same flags as the real build
    # (cargo-chef replays `.cargo/config.toml`, but cargo-leptos's own RUSTFLAGS
    # additions would invalidate every cooked dependency).
    "--cfg=erase_components",
]

# Target-scoped rustflags REPLACE [build].rustflags rather than merging, so the
# web_sys cfg is repeated here. Only applied to native x86_64 Linux builds —
# the WASM target (wasm32-unknown-unknown) keeps the [build] rustflags above,
# which is important because target-cpu=* is meaningless / breaking for WASM.
#
# x86-64-v3 = modern AMD64 baseline (Haswell+, Zen+): AVX2, BMI1/2, FMA, F16C.
# Chosen over znver2 because cargo applies these rustflags to build scripts and
# proc-macros (compiled for the *host* target, which on Linux is also
# x86_64-unknown-linux-gnu). GitHub Actions runners aren't all Zen 2, so
# znver2-targeted build scripts would intermittently SIGILL mid-build. v3 is
# universal across modern x86 and gives up only minor scheduling hints vs
# znver2 — set `RUSTFLAGS` locally if you want a hotter target for dev builds.
[target.x86_64-unknown-linux-gnu]
rustflags = [
    "--cfg=web_sys_unstable_apis",
    # Repeated from `[build]` (this table replaces it): the prod server must
    # render the same erased tree the wasm client hydrates. See the note above.
    "--cfg=erase_components",
    # Makes "Tried to access a reactive value that has already been disposed."
    # name the signal instead of being anonymous. reactive_graph's
    # `unwrap_signal!` only prints the signal's `defined_at` and the access site
    # under `cfg(any(debug_assertions, leptos_debuginfo))`; prod is a release
    # build, so every one of the 318 GlitchTip #7269 events so far carries the
    # generic message and an unsymbolized stack, and the panicking site has
    # stayed unidentified across three triage passes.
    #
    # Scoped to the native Linux target on purpose: the WASM build keeps the
    # `[build]` rustflags above, so the client bundle does not grow a
    # `&'static Location` per signal and per element. The cfg only adds
    # metadata fields and `#[track_caller]` — it does not change the SSR HTML,
    # so server/client hydration parity is unaffected.
    "--cfg=leptos_debuginfo",
    "-C",
    "target-cpu=x86-64-v3",
]
